[project]
name = "vehicle-photo-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7.1",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
